name: POSTAC_MASTER A1 CI

on:
  pull_request:
    paths:
      - "lib/portrait-analysis/**"
      - "lib/portrait-analysis-mlkit/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/postac-master-a1.yml"
  push:
    branches:
      - "feature/postac-master-a1-benchmark"
    paths:
      - "lib/portrait-analysis/**"
      - "lib/portrait-analysis-mlkit/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/postac-master-a1.yml"

permissions:
  contents: read

concurrency:
  group: postac-master-a1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portrait-analysis-tests:
    name: Portrait analysis tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Inspect portrait modules
        run: >-
          ./gradlew
          :lib:portrait-analysis:tasks
          :lib:portrait-analysis-mlkit:tasks
          --all
          --stacktrace
          --no-daemon

      - name: Assemble portrait modules
        run: >-
          ./gradlew
          :lib:portrait-analysis:assemble
          :lib:portrait-analysis-mlkit:assemble
          --stacktrace
          --no-daemon

      - name: Run portrait module unit tests
        run: >-
          ./gradlew
          :lib:portrait-analysis:test
          :lib:portrait-analysis-mlkit:test
          --stacktrace
          --no-daemon

      - name: Run portrait module lint
        run: >-
          ./gradlew
          :lib:portrait-analysis:lint
          :lib:portrait-analysis-mlkit:lint
          --stacktrace
          --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: portrait-analysis-reports
          if-no-files-found: ignore
          path: |
            lib/portrait-analysis/build/reports/**
            lib/portrait-analysis/build/test-results/**
            lib/portrait-analysis-mlkit/build/reports/**
            lib/portrait-analysis-mlkit/build/test-results/**
